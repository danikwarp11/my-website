<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Финансовый Трекер PRO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="app-container">
        <!-- Шапка приложения -->
               <!-- Шапка приложения с двумя показателями -->
               <header class="main-header">
                <div>
                    <h1>📊 Финансовый Трекер PRO</h1>
                    <!-- Переключатель месяцев -->
                    <div class="month-selector-wrapper">
                        <label for="view-month">Просмотр месяца:</label>
                        <select id="view-month" onchange="changeViewMonth()">
                            <option value="0">Январь</option>
                            <option value="1">Февраль</option>
                            <option value="2">Март</option>
                            <option value="3">Апрель</option>
                            <option value="4">Май</option>
                            <option value="5">Июнь</option>
                            <option value="6">Июль</option>
                            <option value="7">Август</option>
                            <option value="8">Сентябрь</option>
                            <option value="9">Октябрь</option>
                            <option value="10">Ноябрь</option>
                            <option value="11">Декабрь</option>
                        </select>
                        <select id="view-year" onchange="changeViewMonth()">
                            <option value="2026" selected>2026</option>
                            <option value="2027">2027</option>
                            <option value="2028">2028</option>
                        </select>
                    </div>
                </div>
                
                <div style="text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 10px;">
                    <button id="theme-toggle" onclick="toggleTheme()" style="width: auto; padding: 6px 12px; font-size: 12px; background: #86868b;">🌓 Тема</button>
                    <div class="balance-cards-group" style="display: flex; gap: 15px;">
                        <!-- Карточка 1: Общий доход -->
                        <div class="balance-card header-income-card">
                            <span class="balance-label">Общий доход</span>
                            <span id="total-income" class="balance-value" style="color: var(--green);">0 ₽</span>
                        </div>
                        <!-- Карточка 2: Чистый баланс -->
                        <div class="balance-card">
                            <span class="balance-label">Чистый баланс</span>
                            <span id="total-balance" class="balance-value">0 ₽</span>
                        </div>
                    </div>
                </div>
            </header>
    

        <!-- Вкладки навигации -->
        <nav class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('transactions-screen')">💸 Операции</button>
            <button class="tab-btn" onclick="switchTab('goals-screen')">🎯 Цели</button>
            <button class="tab-btn" onclick="switchTab('debts-screen')">🤝 Долги</button>
            <button class="tab-btn" onclick="switchTab('calendar-screen')">📅 Календарь</button>
        </nav>

        <!-- ЭКРАН 1: ОПЕРАЦИИ -->
        <div id="transactions-screen" class="tab-content active">
            <section class="app-section">
                <h2>Новая операция (Текущая или Планируемая)</h2>
                <div class="form-group">
                    <input type="number" id="tx-amount" placeholder="Сумма (₽)">
                    <input type="text" id="tx-desc" placeholder="Описание">
                    <input type="date" id="tx-date">
                    
                    <select id="tx-category">
                        <option value="💼 Доход">💼 Доход (Зарплата, фриланс и т.д.)</option>
                        <option value="🍔 Еда">🍔 Еда и продукты</option>
                        <option value="🏠 Жилье">🏠 Жилье и коммуналка</option>
                        <option value="🚗 Транспорт">🚗 Транспорт и такси</option>
                        <option value="🎉 Развлечения">🎉 Развлечения и отдых</option>
                        <option value="🛍️ Покупки">🛍️ Покупки и одежда</option>
                        <option value="🛠️ Другое" selected>🛠️ Другое</option>
                    </select>

                    <select id="tx-type" onchange="toggleCategoryStyle()">
                        <option value="expense">Расход (-)</option>
                        <option value="income">Доход (+)</option>
                    </select>
                    <button onclick="addTransaction()">Добавить операцию</button>
                </div>
                <h3>История транзакций за выбранный месяц</h3>
                <div id="tx-list" class="list-container"></div>
            </section>
        </div>

        <!-- ЭКРАН 2: ЦЕЛИ -->
        <div id="goals-screen" class="tab-content">
            <section class="app-section">
                <h2>🎯 Новая цель на покупку</h2>
                <div class="form-group">
                    <input type="text" id="goal-name" placeholder="Что хочу купить?">
                    <input type="number" id="goal-target" placeholder="Сколько стоит (₽)">
                    <input type="number" id="goal-current" placeholder="Уже накоплено (₽)" value="0">
                    <button onclick="addGoal()">Создать цель</button>
                </div>
                <h3>Мои активные цели</h3>
                <div id="goals-list" class="list-container"></div>
            </section>
        </div>

        <!-- ЭКРАН 3: ДОЛГИ -->
        <div id="debts-screen" class="tab-content">
            <section class="app-section">
                <h2>🤝 Новый долг</h2>
                <div class="form-group">
                    <input type="text" id="debt-name" placeholder="Имя человека">
                    <input type="number" id="debt-amount" placeholder="Сумма (₽)">
                    <input type="date" id="debt-date">
                    <select id="debt-type">
                        <option value="i-owe">Я должен (-)</option>
                        <option value="me-owe">Мне должны (+)</option>
                    </select>
                    <button onclick="addDebt()">Записать долг</button>
                </div>
                <h3>Список долгов на выбранный месяц</h3>
                <div id="debts-list" class="list-container"></div>
            </section>
        </div>

        <!-- ЭКРАН 4: КАЛЕНДАРЬ -->
        <div id="calendar-screen" class="tab-content">
            <section class="app-section">
                <h2 id="calendar-title">📅 Календарь запланированных трат</h2>
                <!-- Сюда будет рендериться наш собственный календарь -->
                <div id="custom-calendar"></div>
            </section>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
