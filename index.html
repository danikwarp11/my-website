<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Финансовый Трекер PRO</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- ШАПКА ПРИЛОЖЕНИЯ -->
        <header class="main-header">
            <div>
                <h1>Финансы</h1>
                <div class="month-selector-wrapper" style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
                    <button onclick="stepMonth(-1)" class="nav-arrow-btn">◀</button>
                    <select id="view-month" onchange="changeViewMonth()">
                        <option value="0">Январь</option><option value="1">Февраль</option>
                        <option value="2">Март</option><option value="3">Апрель</option>
                        <option value="4">Май</option><option value="5">Июнь</option>
                        <option value="6">Июль</option><option value="7">Август</option>
                        <option value="8">Сентябрь</option><option value="9">Октябрь</option>
                        <option value="10">Ноябрь</option><option value="11">Декабрь</option>
                    </select>
                    <select id="view-year" onchange="changeViewMonth()">
                        <option value="2026">2026</option><option value="2027">2027</option>
                    </select>
                    <button onclick="stepMonth(1)" class="nav-arrow-btn">▶</button>
                </div>
            </div>
            <div class="header-right-side">
                <div class="balance-cards-group">
                    <div class="balance-card clickable-card" onclick="showStatModal('income')">
                        <span class="balance-label">Доход</span>
                        <div id="total-income">0 ₽</div>
                    </div>
                    <div class="balance-card">
                        <span class="balance-label">Баланс</span>
                        <div id="total-balance">0 ₽</div>
                    </div>
                    <div class="balance-card clickable-card" onclick="showStatModal('undated-debts')">
                        <span class="balance-label">Бессроч. долги</span>
                        <div id="total-undated-debts">0 ₽</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- НАВИГАЦИОННЫЕ ВКЛАДКИ (ТАБ-БАР НА 5 ЭКРАНОВ) -->
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('transactions-screen')">Операции</button>
            <button class="tab-btn" onclick="switchTab('calendar-screen')">Календарь</button>
            <button class="tab-btn" onclick="switchTab('debts-screen')">Долги</button>
            <button class="tab-btn" onclick="switchTab('goals-screen')">Цели</button>
            <button class="tab-btn" onclick="switchTab('analytics-screen')">Аналитика</button>
        </div>

        <!-- ЭКРАН 1: ОПЕРАЦИИ -->
        <div id="transactions-screen" class="tab-content active">
            <div class="app-section" style="margin-bottom: 20px;">
                <h2>➕ Добавить операцию</h2>
                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label class="field-label">Сумма (₽)</label>
                        <input type="number" id="tx-amount" placeholder="0" inputmode="decimal">
                    </div>
                    <div>
                        <label class="field-label">Категория</label>
                        <select id="tx-category">
                            <option value="💼 Доход">💼 Доход</option>
                            <option value="🛒 Продукты">🛒 Продукты</option>
                            <option value="🚗 Траспорт">🚗 Транспорт</option>
                            <option value="☕ Кафе">☕ Кафе</option>
                            <option value="🎬 Развлечения">🎬 Развлечения</option>
                            <option value="🛠️ Другое" selected>🛠️ Другое</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="field-label">Описание</label>
                    <input type="text" id="tx-desc" placeholder="На что потрачено">
                </div>
                <div class="form-group">
                    <label class="field-label">Дата (пусто — бессрочно)</label>
                    <input type="date" id="tx-date">
                </div>
                <button onclick="addTransaction()">Сохранить операцию</button>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="app-section">
                    <h2>Поступления</h2>
                    <div id="tx-income-list" class="list-container"></div>
                </div>
                <div class="app-section">
                    <h2>Расходы</h2>
                    <div id="tx-expense-list" class="list-container"></div>
                </div>
            </div>
        </div>

        <!-- ЭКРАН 2: КАЛЕНДАРЬ -->
        <div id="calendar-screen" class="tab-content">
            <div class="app-section" style="margin-bottom: 20px;">
                <h2 id="calendar-title">📅 Календарь трат</h2>
                <div id="custom-calendar"></div>
            </div>
            <div class="app-section">
                <h2>💳 Регулярные подписки</h2>
                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div><input type="number" id="pay-amount" placeholder="Сумма"></div>
                    <div><input type="number" id="pay-day" placeholder="Число месяца (1-31)"></div>
                </div>
                <div class="form-group"><input type="text" id="pay-desc" placeholder="Название подписки"></div>
                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <select id="pay-end-month"><option value="11">Декабрь</option></select>
                    <select id="pay-end-year"><option value="2026">2026</option></select>
                </div>
                <button onclick="addRecurringPayment()" style="background: #5856d6;">Добавить подписку</button>
                <div id="payments-list" class="list-container" style="margin-top: 15px;"></div>
            </div>
        </div>
        <!-- ЭКРАН 3: ДОЛГИ -->
        <div id="debts-screen" class="tab-content">
            <div class="app-section">
                <h2>🤝 Учет долгов</h2>
                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label class="field-label">Имя человека</label>
                        <input type="text" id="debt-name" placeholder="Кто">
                    </div>
                    <div>
                        <label class="field-label">Сумма</label>
                        <input type="number" id="debt-amount" placeholder="0">
                    </div>
                </div>
                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label class="field-label">Тип долга</label>
                        <select id="debt-type">
                            <option value="i-owe">Я должен</option>
                            <option value="me-owe">Мне должны</option>
                        </select>
                    </div>
                    <div>
                        <label class="field-label">Срок выплаты</label>
                        <input type="date" id="debt-date">
                    </div>
                </div>
                <div class="form-group">
                    <label class="field-label">Комментарий</label>
                    <input type="text" id="debt-desc" placeholder="За что долг">
                </div>
                <button onclick="addDebt()" style="background: #ff9500;">Зафиксировать долг</button>
                <div id="debts-list" class="list-container" style="margin-top: 15px;"></div>
            </div>
        </div>

        <!-- ЭКРАН 4: ЦЕЛИ -->
        <div id="goals-screen" class="tab-content">
            <div class="app-section">
                <h2>🎯 Копилка на цели</h2>
                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                    <div style="grid-column: span 1;">
                        <label class="field-label">Название цели</label>
                        <input type="text" id="goal-name" placeholder="На машину">
                    </div>
                    <div>
                        <label class="field-label">Надо собрать</label>
                        <input type="number" id="goal-target" placeholder="0">
                    </div>
                    <div>
                        <label class="field-label">Уже есть</label>
                        <input type="number" id="goal-current" value="0">
                    </div>
                </div>
                <button onclick="addGoal()" style="background: var(--green);">Создать цель</button>
                <div id="goals-list" style="margin-top: 15px;"></div>
            </div>
        </div>

        <!-- ЭКРАН 5: АНАЛИТИКА -->
        <div id="analytics-screen" class="tab-content">
            <div class="app-section">
                <h2>📊 Финансовая аналитика</h2>
                <div class="analytics-toggle-wrapper" style="display: flex; background: var(--tab-bg); padding: 3px; border-radius: 8px; margin-bottom: 20px;">
                    <button id="btn-chart-expense" onclick="setAnalyticsMode('expense')" style="flex: 1; padding: 8px; font-size: 13px; border: none; border-radius: 6px; background: var(--card-bg); color: var(--text-main); cursor: pointer; font-weight: 600;">📉 Расходы</button>
                    <button id="btn-chart-income" onclick="setAnalyticsMode('income')" style="flex: 1; padding: 8px; font-size: 13px; border: none; border-radius: 6px; background: none; color: var(--text-muted); cursor: pointer; font-weight: 600;">💼 Доходы</button>
                </div>
                <div style="position: relative; height: 260px; width: 100%; display: flex; justify-content: center; align-items: center;">
                    <canvas id="financeCircleChart"></canvas>
                </div>
                <div id="analytics-legend-list" style="margin-top: 25px;" class="list-container"></div>
            </div>
        </div>

    </div> <!-- Конец app-container -->

    <!-- МОДАЛЬНЫЕ ОКНА -->
    <div id="modal-statistics" class="modal-backdrop">
        <div class="modal-window"><h3 id="stat-modal-title">Детализация</h3><div id="stat-modal-content" class="list-container"></div><div class="modal-buttons"><button class="cancel-btn" onclick="closeStatModal()">Закрыть</button></div></div>
    </div>
    <div id="modal-edit-goal" class="modal-backdrop">
        <div class="modal-window"><h3>🎯 Изменить цель</h3><input type="hidden" id="edit-goal-id"><label class="modal-label">Название</label><input type="text" id="edit-goal-name"><label class="modal-label">Цель (₽)</label><input type="number" id="edit-goal-target"><label class="modal-label">Баланс (₽)</label><input type="number" id="edit-goal-current"><div class="modal-buttons"><button class="cancel-btn" onclick="closeGoalModal()">Отмена</button><button onclick="saveGoalModal()">Сохранить</button></div></div>
    </div>
    <div id="modal-edit-debt" class="modal-backdrop">
        <div class="modal-window"><h3>🤝 Редактировать долг</h3><input type="hidden" id="edit-debt-id"><label class="modal-label">Имя</label><input type="text" id="edit-debt-name"><label class="modal-label">Сумма</label><input type="number" id="edit-debt-amount"><label class="modal-label">Срок</label><input type="date" id="edit-debt-date"><label class="modal-label">Заметка</label><input type="text" id="edit-debt-desc"><div class="modal-buttons"><button class="cancel-btn" onclick="closeDebtModal()">Отмена</button><button onclick="saveDebtModal()">Сохранить</button></div></div>
    </div>
    <div id="modal-calendar-debt" class="modal-backdrop">
        <div class="modal-window"><h3>Управление долгом</h3><input type="hidden" id="cal-debt-id"><p id="cal-debt-text" style="font-size: 14px; text-align: center;"></p><button onclick="resolveDebtFromCalendar(true)" style="background: var(--green); margin-bottom: 10px;">✅ Погашен</button><button onclick="resolveDebtFromCalendar(false)" style="background: var(--red); margin-bottom: 10px;">✕ Удалить</button><button class="cancel-btn" onclick="closeCalDebtModal()">Отмена</button></div>
    </div>
    <div id="modal-calendar-pay" class="modal-backdrop">
        <div class="modal-window"><h3>Управление платежом</h3><input type="hidden" id="cal-pay-id"><input type="hidden" id="cal-pay-date"><p id="cal-pay-text" style="font-size: 14px; text-align: center;"></p><button onclick="resolvePayFromCalendar(true)" style="background: var(--green); margin-bottom: 10px;">✔ Оплачен</button><button onclick="resolvePayFromCalendar(false)" style="background: var(--tab-bg); margin-bottom: 10px; color:#fff;">⏭ Пропустить</button><button class="cancel-btn" onclick="closeCalPayModal()">Отмена</button></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
